version: '1.0'
name: android-build
displayName: 暗区指令工具 云编译
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - main
stages:
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@gradle
        name: build_apk
        displayName: Android APK 构建
        jdkVersion: '21'
        gradleVersion: 9.5.1
        commands:
          - '# 功能：Android Debug 包构建（首次自动安装 Android SDK）'
          - 'set -e'
          - 'chmod +x ./gradlew'
          - 'export ANDROID_HOME=$HOME/android-sdk'
          - 'mkdir -p $ANDROID_HOME/cmdline-tools'
          - 'if [ ! -d $ANDROID_HOME/cmdline-tools/latest ]; then'
          - '  command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)'
          - '  curl -sL -o $ANDROID_HOME/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          - '  unzip -q $ANDROID_HOME/cmdtools.zip -d $ANDROID_HOME/cmdline-tools'
          - '  mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest'
          - '  yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true'
          - '  $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"'
          - 'fi'
          - 'echo "sdk.dir=$ANDROID_HOME" > local.properties'
          - './gradlew assembleDebug --no-daemon'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./app/build/outputs/apk/debug
        settings: []
        caches:
          - ~/.gradle/caches
          - ~/android-sdk
        notify: []
        strategy:
          retry: '0'
